<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-inner{{ end }}">
<a class="skip-link" href="#main">{{ i18n "skipLink" }}</a>
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ $js := resources.Get "js/site.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
