<header class="site-header">
<nav class="wrap nav" aria-label="Main">
<a class="logo" href="{{ "/" | relLangURL }}">{{ partial "icons/berry.html" (dict "size" 40) }}<span>{{ i18n "logoWord" | safeHTML }}</span></a>
<div class="nav-links">
<a href="{{ "/" | relLangURL }}#apps">{{ i18n "navApps" }}</a>
<a href="{{ "/" | relLangURL }}#principles">{{ i18n "navPrinciples" }}</a>
<a href="{{ "/" | relLangURL }}#about">{{ i18n "navAbout" }}</a>
{{- range .Translations }}
<a class="lang-switch" href="{{ .RelPermalink }}" hreflang="{{ .Language.LanguageCode }}" lang="{{ .Language.LanguageCode }}">{{ .Language.LanguageName }}</a>
{{- end }}
<a class="btn btn-sm" href="mailto:{{ site.Params.email }}">{{ i18n "navContact" }}</a>
</div>
</nav>
</header>
